# ============================================
# IHCL Contract Pipeline — Docker Compose
# ============================================
# Usage:
#   docker-compose up -d          → Start all services
#   docker-compose down           → Stop all services
#   docker-compose logs -f app    → Stream app logs
# ============================================

version: "3.9"

services:
  # -----------------------------------------
  # Qdrant Vector Database
  # -----------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: ihcl-qdrant
    ports:
      - "6333:6333"    # REST API
      - "6334:6334"    # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------
  # FastAPI Application
  # -----------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ihcl-pipeline-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data:z
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  qdrant_storage: